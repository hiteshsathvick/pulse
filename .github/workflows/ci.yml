name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]
      - name: Ruff check
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]
      - name: Mypy
        working-directory: backend
        run: mypy pulse

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: pulse
          CLICKHOUSE_PASSWORD: pulse
          CLICKHOUSE_DB: pulse
        ports: ["8123:8123", "9000:9000"]
    env:
      # Confirmed by reproducing this exact env locally: with DATABASE_URL
      # pointing at the bootstrap/superuser role instead of pulse_app, RLS is
      # unconditionally bypassed (Postgres never applies RLS to superusers,
      # even with FORCE) and test_tenant_isolation.py's two tests both fail
      # for real -- cross-org rows leak straight through. DATABASE_URL must
      # be the app role; DATABASE_BOOTSTRAP_URL (superuser) is only for
      # alembic/env.py's one-time _ensure_app_role_exists step.
      DATABASE_URL: postgresql+asyncpg://pulse_app:pulse_app@localhost:5432/pulse
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: pulse
      CLICKHOUSE_PASSWORD: pulse
      CLICKHOUSE_DATABASE: pulse
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9002
      S3_ACCESS_KEY: pulse
      S3_SECRET_KEY: pulse12345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]

      # Not a `services:` container -- those can't override a container's
      # command, and the official minio/minio image needs `server /data`
      # passed explicitly or it never starts serving. Missing since this job
      # was first written; Phase 8/9's worker tests (object-storage
      # archiving) need it and were silently unexercised in CI until now.
      #
      # Two things that made this step fail (exit 125) on every run: the
      # `minio/minio` Docker Hub repository no longer exists (MinIO publishes
      # to quay.io now), and host port 9000 is already taken by the ClickHouse
      # service's native port -- the same clash the local compose file avoids
      # by publishing MinIO on 9002. The tag is pinned, not `latest`, so a
      # future upstream change can't silently break CI again.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=pulse -e MINIO_ROOT_PASSWORD=pulse12345 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 2
          done
          echo "ClickHouse never became ready" >&2
          exit 1

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9002/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO never became ready" >&2
          exit 1

      - name: Run backend tests
        working-directory: backend
        run: pytest -v --junitxml=report.xml

      # GitHub step logs need a signed-in browser; annotations don't. This
      # keeps a red run's reason readable without a login.
      - name: Annotate pytest failures
        if: failure()
        working-directory: backend
        run: python ../.github/scripts/report_pytest_failures.py report.xml

  test-sdk-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json
      - name: Install sdk-js deps
        working-directory: packages/sdk-js
        run: npm ci
      - name: Typecheck
        working-directory: packages/sdk-js
        run: npm run typecheck
      - name: Test
        working-directory: packages/sdk-js
        run: npm test
      - name: Build
        working-directory: packages/sdk-js
        run: npm run build

  dependency-scan:
    # Phase 22. Advisory, not blocking: pip-audit/npm audit found real,
    # currently-unfixable findings when this job was added (starlette has no
    # newer version resolvable in this environment's index at all; pytest's
    # and vitest's fixes are both major-version bumps of dev-only tooling,
    # each needing its own full regression pass before landing, not a Phase
    # 22 side effect). A blocking gate here would leave CI permanently red
    # over things this run can't fix, which defeats "CI stays green" as a
    # signal. Findings are tracked in docs/THREAT_MODEL.md; each step still
    # runs and prints its report every time, so new findings stay visible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        working-directory: backend
        run: pip install pip-audit && pip-audit || true
      - name: pip-audit (sdk-python)
        working-directory: packages/sdk-python
        run: pip-audit || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high || true
      - name: npm audit (sdk-js)
        working-directory: packages/sdk-js
        run: npm ci && npm audit --audit-level=high || true

  # Phase 23: the deploy configuration is code, so it is checked like code. None
  # of this touches a cloud account -- it proves the Terraform, the Render
  # Blueprints and the compose files are well-formed, which is what keeps a
  # broken deploy config from being discovered at 2am during a real deploy.
  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render Blueprints match Render's published schema
        run: |
          pip install check-jsonschema
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json infra/render/*.render.yaml

      - name: Compose files render (base, and with the observability stack)
        working-directory: infra/docker
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q

  test-sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sdk-python deps
        working-directory: packages/sdk-python
        run: pip install -e .[dev]
      - name: Ruff check
        working-directory: packages/sdk-python
        run: ruff check .
      - name: Mypy
        working-directory: packages/sdk-python
        run: mypy pulse_sdk
      - name: Test
        working-directory: packages/sdk-python
        run: pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      # Playwright e2e flows (e2e/*.spec.ts) need the full docker-compose
      # stack, not just `next dev` -- kept local-only for this phase (see
      # playwright.config.ts), wired into CI once a later phase needs it.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pulse-backend:ci backend

      # Advisory for the same reason dependency-scan is (docs/THREAT_MODEL.md):
      # the known starlette CVEs have no resolvable fix yet, so a blocking gate
      # would leave CI permanently red. It still prints the report every push,
      # and continue-on-error covers the scanner's own vulnerability-DB download
      # failing, which must not fail a build either.
      - name: Scan backend image (Trivy, HIGH/CRITICAL)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.57.0 image --severity HIGH,CRITICAL --exit-code 0 pulse-backend:ci

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Next build
        working-directory: frontend
        run: npm run build

      - name: Build frontend image
        run: docker build -t pulse-frontend:ci frontend
