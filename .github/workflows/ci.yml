name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]
      - name: Ruff check
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]
      - name: Mypy
        working-directory: backend
        run: mypy pulse

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: pulse
          CLICKHOUSE_PASSWORD: pulse
          CLICKHOUSE_DB: pulse
        ports: ["8123:8123", "9000:9000"]
    env:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: pulse
      CLICKHOUSE_PASSWORD: pulse
      CLICKHOUSE_DATABASE: pulse
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pulse
      S3_SECRET_KEY: pulse12345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]

      # Not a `services:` container -- those can't override a container's
      # command, and the official minio/minio image needs `server /data`
      # passed explicitly or it never starts serving. Missing since this job
      # was first written; Phase 8/9's worker tests (object-storage
      # archiving) need it and were silently unexercised in CI until now.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pulse -e MINIO_ROOT_PASSWORD=pulse12345 \
            minio/minio server /data

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 2
          done
          echo "ClickHouse never became ready" >&2
          exit 1

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO never became ready" >&2
          exit 1

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  test-sdk-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json
      - name: Install sdk-js deps
        working-directory: packages/sdk-js
        run: npm ci
      - name: Typecheck
        working-directory: packages/sdk-js
        run: npm run typecheck
      - name: Test
        working-directory: packages/sdk-js
        run: npm test
      - name: Build
        working-directory: packages/sdk-js
        run: npm run build

  test-sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sdk-python deps
        working-directory: packages/sdk-python
        run: pip install -e .[dev]
      - name: Ruff check
        working-directory: packages/sdk-python
        run: ruff check .
      - name: Mypy
        working-directory: packages/sdk-python
        run: mypy pulse_sdk
      - name: Test
        working-directory: packages/sdk-python
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pulse-backend:ci backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Next build
        working-directory: frontend
        run: npm run build

      - name: Build frontend image
        run: docker build -t pulse-frontend:ci frontend
