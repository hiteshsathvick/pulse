name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]
      - name: Ruff check
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]
      - name: Mypy
        working-directory: backend
        run: mypy pulse

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: pulse
          CLICKHOUSE_PASSWORD: pulse
          CLICKHOUSE_DB: pulse
        ports: ["8123:8123", "9000:9000"]
    env:
      # Confirmed by reproducing this exact env locally: with DATABASE_URL
      # pointing at the bootstrap/superuser role instead of pulse_app, RLS is
      # unconditionally bypassed (Postgres never applies RLS to superusers,
      # even with FORCE) and test_tenant_isolation.py's two tests both fail
      # for real -- cross-org rows leak straight through. DATABASE_URL must
      # be the app role; DATABASE_BOOTSTRAP_URL (superuser) is only for
      # alembic/env.py's one-time _ensure_app_role_exists step.
      DATABASE_URL: postgresql+asyncpg://pulse_app:pulse_app@localhost:5432/pulse
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: pulse
      CLICKHOUSE_PASSWORD: pulse
      CLICKHOUSE_DATABASE: pulse
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9002
      S3_ACCESS_KEY: pulse
      S3_SECRET_KEY: pulse12345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]

      # Not a `services:` container -- those can't override a container's command,
      # and this image needs `server -s3 -dir=/data` passed explicitly.
      #
      # The object store is SeaweedFS, pinned. It replaced MinIO when quay.io began
      # answering 401 to anonymous pulls of quay.io/minio/minio (the `minio/minio`
      # Docker Hub repository was already gone), which failed this step on the first
      # run after the change: four pull attempts in a row, so not a flake. The S3 API
      # listens on 8333 and is published on 9002 to match the app's default
      # S3_ENDPOINT_URL (host 9000 is ClickHouse's native port). No identities are
      # configured, so it is unauthenticated -- fine for an ephemeral runner.
      - name: Start object store
        run: |
          image=chrislusf/seaweedfs:4.47
          for attempt in 1 2 3 4; do
            docker pull "$image" && break
            [ "$attempt" = 4 ] && { echo "::error title=Object store image pull failed::could not pull $image after 4 attempts"; exit 1; }
            sleep $((attempt * 5))
          done
          docker run -d --name objectstore -p 9002:8333 "$image" server -s3 -dir=/data

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 2
          done
          echo "ClickHouse never became ready" >&2
          exit 1

      - name: Wait for object store
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9002/ >/dev/null && exit 0
            sleep 2
          done
          echo "The object store never became ready" >&2
          docker logs objectstore >&2 || true
          exit 1

      - name: Run backend tests
        working-directory: backend
        run: pytest -v --junitxml=report.xml

      # GitHub step logs need a signed-in browser; annotations don't. This
      # keeps a red run's reason readable without a login.
      - name: Annotate pytest failures
        if: failure()
        working-directory: backend
        run: python ../.github/scripts/report_pytest_failures.py report.xml

  test-sdk-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json
      - name: Install sdk-js deps
        working-directory: packages/sdk-js
        run: npm ci
      - name: Typecheck
        working-directory: packages/sdk-js
        run: npm run typecheck
      - name: Test
        working-directory: packages/sdk-js
        run: npm test
      - name: Build
        working-directory: packages/sdk-js
        run: npm run build

  dependency-scan:
    # Phase 22 added this as advisory: starlette, pytest and the vitest chain had
    # findings it couldn't fix. Phase 24 fixed them (fastapi 0.141 + starlette 1.7,
    # pytest 9, vitest 4), every scan is clean, and this is now a blocking gate.
    #
    # The cost of blocking, stated plainly: CI installs the newest version each
    # dependency range allows, so a newly *published* advisory can turn a push red
    # with no change of ours. That is the gate doing its job. Fix it by bumping the
    # dependency; if no fixed version exists, add `--ignore-vuln <ID>` to the step
    # below and record the reasoning in docs/THREAT_MODEL.md. npm is gated at `high`
    # because npm reports severity; pip-audit doesn't, so any finding fails it.
    #
    # Phase 24 also fixed the scan itself. The Python steps used to run pip-audit on
    # a runner where the project's dependencies had never been installed, so they
    # audited almost nothing. Each now installs into its own virtualenv first (one
    # shared environment would let the backend's packages leak into the SDK's audit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m venv /tmp/backend-venv
          # `python -m venv` bundles whatever pip shipped with the interpreter, and
          # pip-audit audits the whole environment, pip included. The bundled pip
          # (25.0.1) had five published advisories fixed in 26.x, which failed this
          # job -- so upgrade it before auditing.
          /tmp/backend-venv/bin/pip install --upgrade pip
          /tmp/backend-venv/bin/pip install -e ".[dev]" pip-audit
          # Findings are also emitted as an annotation: step logs need a GitHub
          # sign-in to read, annotations do not.
          if ! /tmp/backend-venv/bin/pip-audit --skip-editable > /tmp/audit.txt 2>&1; then
            cat /tmp/audit.txt
            echo "::error title=pip-audit (backend) found vulnerabilities::$(tr '\n' ' ' < /tmp/audit.txt | cut -c1-1500)"
            exit 1
          fi
          cat /tmp/audit.txt
      - name: pip-audit (sdk-python)
        working-directory: packages/sdk-python
        run: |
          python -m venv /tmp/sdk-venv
          # `python -m venv` bundles whatever pip shipped with the interpreter, and
          # pip-audit audits the whole environment, pip included. The bundled pip
          # (25.0.1) had five published advisories fixed in 26.x, which failed this
          # job -- so upgrade it before auditing.
          /tmp/sdk-venv/bin/pip install --upgrade pip
          /tmp/sdk-venv/bin/pip install -e ".[dev]" pip-audit
          # Findings are also emitted as an annotation: step logs need a GitHub
          # sign-in to read, annotations do not.
          if ! /tmp/sdk-venv/bin/pip-audit --skip-editable > /tmp/audit.txt 2>&1; then
            cat /tmp/audit.txt
            echo "::error title=pip-audit (sdk-python) found vulnerabilities::$(tr '\n' ' ' < /tmp/audit.txt | cut -c1-1500)"
            exit 1
          fi
          cat /tmp/audit.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci
          if ! npm audit --audit-level=high > /tmp/audit.txt 2>&1; then
            cat /tmp/audit.txt
            echo "::error title=npm audit (frontend) found vulnerabilities::$(tr '\n' ' ' < /tmp/audit.txt | cut -c1-1500)"
            exit 1
          fi
          cat /tmp/audit.txt
      - name: npm audit (sdk-js)
        working-directory: packages/sdk-js
        run: |
          npm ci
          if ! npm audit --audit-level=high > /tmp/audit.txt 2>&1; then
            cat /tmp/audit.txt
            echo "::error title=npm audit (sdk-js) found vulnerabilities::$(tr '\n' ' ' < /tmp/audit.txt | cut -c1-1500)"
            exit 1
          fi
          cat /tmp/audit.txt

  # Phase 23: the deploy configuration is code, so it is checked like code. None
  # of this touches a cloud account -- it proves the Terraform, the Render
  # Blueprints and the compose files are well-formed, which is what keeps a
  # broken deploy config from being discovered at 2am during a real deploy.
  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (with the opt-in remote-state override)
        working-directory: infra/terraform
        run: |
          cp backend_override.tf.example backend_override.tf
          terraform init -backend=false -input=false -reconfigure
          terraform validate
          rm backend_override.tf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render Blueprints match Render's published schema
        run: |
          pip install check-jsonschema
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json infra/render/*.render.yaml

      - name: Deployed Prometheus config is valid (promtool)
        run: |
          sh -n infra/observability/prometheus-render-entrypoint.sh
          sed -e 's|@@METRICS_TOKEN@@|tokenabc123|g' -e 's|@@HOST_[A-Z_]*@@|some-host-abcd|g' \
            infra/observability/prometheus.render.yml > /tmp/prometheus.yml
          docker run --rm --entrypoint promtool -v /tmp/prometheus.yml:/prometheus.yml \
            prom/prometheus:v2.55.0 check config /prometheus.yml

      - name: Compose files render (base, and with the observability stack)
        working-directory: infra/docker
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q

  test-sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sdk-python deps
        working-directory: packages/sdk-python
        run: pip install -e .[dev]
      - name: Ruff check
        working-directory: packages/sdk-python
        run: ruff check .
      - name: Mypy
        working-directory: packages/sdk-python
        run: mypy pulse_sdk
      - name: Test
        working-directory: packages/sdk-python
        run: pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      # Playwright e2e flows (e2e/*.spec.ts) need the full docker-compose
      # stack, not just `next dev` -- kept local-only for this phase (see
      # playwright.config.ts), wired into CI once a later phase needs it.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pulse-backend:ci backend

      # Phase 24: blocking. Only findings that already have a fix (--ignore-unfixed)
      # fail the build: the base image is patched at build time (backend/Dockerfile
      # runs apt-get upgrade), so a fixable finding here means that step regressed,
      # while an unfixable one is not something the build can act on. A fresh build
      # in CI picks up newly published Debian fixes on its own.
      - name: Scan backend image (Trivy, fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.0 image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress pulse-backend:ci

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Next build
        working-directory: frontend
        run: npm run build

      - name: Build frontend image
        run: docker build -t pulse-frontend:ci frontend
