services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-pulse}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  objectstore:
    # SeaweedFS, pinned. This was MinIO until quay.io/minio/minio (and Docker Hub's
    # before it) stopped serving anonymous pulls -- it answers 401, so a fresh
    # checkout or CI runner could no longer pull it (only machines with a cached copy
    # kept working). SeaweedFS is a maintained, real S3 implementation; the app talks
    # to it through the generic S3 client, unchanged.
    #
    # Local development only, and UNAUTHENTICATED (no identities configured), so it is
    # bound to loopback: the S3 API on 8333 is reachable from this machine and from
    # the other containers, never from the network.
    image: chrislusf/seaweedfs:4.47
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:9002:8333"
    volumes:
      - objectstore_data:/data
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to IPv6 (::1),
      # where the S3 port is not listening.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../backend
    command: ["uvicorn", "pulse.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-pulse_app}:${POSTGRES_APP_PASSWORD:-pulse_app}@postgres:5432/${POSTGRES_DB:-pulse}
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@postgres:5432/${POSTGRES_DB:-pulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-pulse}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; import sys; sys.exit(0 if u.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingest-worker:
    build:
      context: ../../backend
    command: ["python", "-m", "pulse.worker.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-pulse_app}:${POSTGRES_APP_PASSWORD:-pulse_app}@postgres:5432/${POSTGRES_DB:-pulse}
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@postgres:5432/${POSTGRES_DB:-pulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-pulse}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://objectstore:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pulse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pulse12345}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy

  alert-worker:
    # Phase 19: a separate long-lived process, like ingest-worker, but on a
    # sleep-loop rather than a blocking stream read -- there's nothing to
    # block on for a periodic evaluation pass. No object-storage
    # dependency: alerts never touch the raw-event archive.
    build:
      context: ../../backend
    command: ["python", "-m", "pulse.alerts.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-pulse_app}:${POSTGRES_APP_PASSWORD:-pulse_app}@postgres:5432/${POSTGRES_DB:-pulse}
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@postgres:5432/${POSTGRES_DB:-pulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-pulse}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing-worker:
    # Phase 20: a separate long-lived process, like alert-worker -- a
    # sleep-loop recomputing every org's current-period usage from real
    # ClickHouse ingestion counts. No Stripe env vars here: like
    # ANTHROPIC_API_KEY/ALERT_WEBHOOK_SECRET, an unset Stripe key is a valid,
    # fully-functional default (billing simply isn't connected yet), picked
    # up from a real .env file or the container's own environment, never
    # wired through docker-compose itself.
    build:
      context: ../../backend
    command: ["python", "-m", "pulse.billing.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-pulse_app}:${POSTGRES_APP_PASSWORD:-pulse_app}@postgres:5432/${POSTGRES_DB:-pulse}
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@postgres:5432/${POSTGRES_DB:-pulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-pulse}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  retention-worker:
    # Phase 22: a separate long-lived process, like alert-worker/billing-worker
    # -- a sleep-loop that sweeps every project's expired events from
    # ClickHouse (per-project retention_days, falling back to the org
    # default). Needs Postgres for org/project settings and ClickHouse for
    # the actual delete mutation; no Redis.
    build:
      context: ../../backend
    command: ["python", "-m", "pulse.retention.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-pulse_app}:${POSTGRES_APP_PASSWORD:-pulse_app}@postgres:5432/${POSTGRES_DB:-pulse}
      DATABASE_BOOTSTRAP_URL: postgresql+asyncpg://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@postgres:5432/${POSTGRES_DB:-pulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-pulse}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  clickhouse_data:
  objectstore_data:
