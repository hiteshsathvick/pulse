[project]
name = "pulse-backend"
version = "0.1.0"
description = "Pulse backend: FastAPI modular monolith (API + ingestion worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2",
    "clickhouse-connect[async]>=1.7,<2",
    "redis>=5.0,<6",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.9,<3",
    "minio>=7.2,<8",
    "anthropic>=0.40,<1",
    "stripe>=11,<12",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20,<1",
    "sentry-sdk>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "httpx>=0.27,<0.28",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
]
# Phase 17 load tests (loadtests/). Not part of `dev`, so CI's install is unchanged.
loadtest = [
    "locust>=2.29,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in argument default) is FastAPI's own documented idiom
# for Depends()/Query()/etc. -- not a bug, and will recur throughout api/.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm_live: runs against the real Anthropic provider; skipped unless PULSE_TEST_LLM_LIVE=1 and ANTHROPIC_API_KEY are set (see tests/nl_eval/test_nl_eval.py).",
]
